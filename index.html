<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <title>Bag</title>
        <meta
            name="description"
            content="A guessing game for little ones: hide something in the bag, then ask questions to find out what it is."
        />
        <link rel="manifest" href="manifest.webmanifest" />
        <meta
            name="theme-color"
            content="#BDE7FF"
            media="(prefers-color-scheme: light)"
        />
        <meta
            name="theme-color"
            content="#1C2554"
            media="(prefers-color-scheme: dark)"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Bag" />
        <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
        <link
            rel="icon"
            type="image/png"
            sizes="192x192"
            href="icons/icon-192.png"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --sky: #bde7ff;
                --sky-dot: #a6dcfa;
                --ink: #3b2a5c; /* plum outline + text */
                --paper: #ffffff;
                --paper-ink: #3b2a5c;
                --sack: #f2b33d; /* mustard bag */
                --sack-dark: #c9851b;
                --ribbon: #ff5a4e; /* tomato */
                --go: #3cc47c; /* grass green */
                --go-dark: #24955a;
                --soft: rgba(59, 42, 92, 0.55);
                --mouth: #5b3412;
                color-scheme: light;
                --font:
                    "Baloo 2", ui-rounded, "SF Pro Rounded",
                    "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) {
                    color-scheme: dark;
                    --sky: #1c2554;
                    --sky-dot: #24306a;
                    --ink: #ffe9b8;
                    --paper: #2c376f;
                    --paper-ink: #fff4da;
                    --soft: rgba(255, 233, 184, 0.65);
                }
            }
            :root[data-theme="dark"] {
                color-scheme: dark;
                --sky: #1c2554;
                --sky-dot: #24306a;
                --ink: #ffe9b8;
                --paper: #2c376f;
                --paper-ink: #fff4da;
                --soft: rgba(255, 233, 184, 0.65);
            }

            * {
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
            }
            html,
            body {
                height: 100%;
                height: 100dvh;
                margin: 0;
            }
            :root {
                padding-top: env(safe-area-inset-top, 0px);
                padding-bottom: env(safe-area-inset-bottom, 0px);
            }
            body {
                background-color: var(--sky);
                background-image: radial-gradient(
                    var(--sky-dot) 18%,
                    transparent 19%
                );
                background-size: 34px 34px;
                color: var(--ink);
                font-family: var(--font);
                overflow: hidden;
                overscroll-behavior: none;
                user-select: none;
                -webkit-user-select: none;
                -webkit-touch-callout: none;
                touch-action: manipulation;
            }
            button,
            input {
                font: inherit;
                color: inherit;
                touch-action: manipulation;
            }
            button:focus-visible,
            input:focus-visible {
                outline: 4px solid var(--ribbon);
                outline-offset: 3px;
            }

            .app {
                height: 100%;
                height: 100dvh;
                max-width: 680px;
                margin: 0 auto;
                display: flex;
                flex-direction: column;
                padding: 8px 14px 12px;
                padding-left: max(14px, env(safe-area-inset-left, 0px));
                padding-right: max(14px, env(safe-area-inset-right, 0px));
            }

            /* ---------- top bar ---------- */
            .bar {
                display: flex;
                align-items: center;
                gap: 8px;
                flex: none;
                min-height: 52px;
            }
            .logo {
                font-weight: 800;
                font-size: 30px;
                line-height: 1;
                letter-spacing: -0.5px;
                margin-right: auto;
                display: flex;
                align-items: center;
                gap: 6px;
                border: 0;
                background: none;
                padding: 4px 8px 4px 2px;
                border-radius: 14px;
                cursor: pointer;
                transition: transform 0.12s ease;
            }
            .logo:active {
                transform: scale(0.94);
            }
            .logo svg {
                width: 30px;
                height: 33px;
            }
            .round-btn {
                width: 46px;
                height: 46px;
                border-radius: 50%;
                border: 3px solid var(--ink);
                background: var(--paper);
                color: var(--paper-ink);
                font-size: 22px;
                display: grid;
                place-items: center;
                cursor: pointer;
                box-shadow: 0 4px 0 var(--ink);
                flex: none;
            }
            .round-btn:active {
                transform: translateY(3px);
                box-shadow: 0 1px 0 var(--ink);
            }
            .round-btn[hidden] {
                display: none;
            }

            .prompt {
                flex: none;
                text-align: center;
                padding: 2px 6px 0;
                min-height: 64px;
            }
            .prompt .big {
                font-weight: 800;
                font-size: clamp(22px, 5vw, 32px);
                line-height: 1.1;
            }
            .prompt .small {
                font-weight: 500;
                font-size: 17px;
                color: var(--soft);
                margin-top: 2px;
            }

            /* ---------- main play area (vertical by default, side-by-side on iPad landscape) ---------- */
            .play-area {
                flex: 1 1 auto;
                min-height: 0;
                display: flex;
                flex-direction: column;
            }

            /* ---------- stage with bag + items ---------- */
            .stage {
                position: relative;
                flex: 1 1 auto;
                min-height: 150px;
            }
            .bag {
                position: absolute;
                left: 50%;
                top: 50%;
                width: var(--bag-w, 160px);
                aspect-ratio: 200 / 220;
                transform: translate(-50%, -50%);
                transition: width 0.45s cubic-bezier(0.3, 1.4, 0.5, 1);
                cursor: pointer;
                touch-action: none;
                border: 0;
                background: none;
                padding: 0;
            }
            .bag > svg,
            .bag .inside {
                position: absolute;
                inset: 0;
            }
            .bag > svg {
                width: 100%;
                height: 100%;
                overflow: visible;
            }
            .bag .inside {
                pointer-events: none;
            }
            .bag .inside .thing {
                position: absolute;
                left: 50%;
                top: 35%;
                font-size: calc(var(--bag-w, 160px) * 0.42);
                line-height: 1;
                transform: translate(-50%, 0) scale(0.5);
                opacity: 0;
                transition:
                    transform 0.35s cubic-bezier(0.3, 1.5, 0.5, 1),
                    opacity 0.2s;
            }
            .bag.peeking .inside .thing {
                transform: translate(-50%, -88%) scale(1);
                opacity: 1;
            }
            .bag .open-only {
                opacity: 0;
                transition: opacity 0.15s;
            }
            .bag .closed-only {
                opacity: 1;
                transition: opacity 0.15s;
            }
            .bag.open .open-only {
                opacity: 1;
            }
            .bag.open .closed-only {
                opacity: 0;
            }
            .bag.hungry {
                animation: wobble 1.1s ease-in-out infinite;
            }
            .bag.gulp {
                animation: gulp 0.5s ease-out;
            }
            .bag.tickle {
                animation: tickle 0.42s ease-in-out;
            }
            .bag.tickle .lids {
                animation: none;
                transform: scaleY(0.82);
            }
            .bag .pupils {
                transition: transform 0.12s linear;
            }
            .bag .lids {
                transform-origin: center 140px;
                transform: scaleY(0);
                animation: blink 5s infinite;
            }
            @keyframes wobble {
                0%,
                100% {
                    transform: translate(-50%, -50%) rotate(0);
                }
                50% {
                    transform: translate(-50%, -50%) rotate(-2.5deg) scale(1.03);
                }
            }
            @keyframes gulp {
                0% {
                    transform: translate(-50%, -50%) scale(1);
                }
                35% {
                    transform: translate(-50%, -50%) scale(1.14, 0.86);
                }
                70% {
                    transform: translate(-50%, -50%) scale(0.94, 1.08);
                }
                100% {
                    transform: translate(-50%, -50%) scale(1);
                }
            }
            @keyframes tickle {
                0%,
                100% {
                    transform: translate(-50%, -50%) rotate(0) scale(1);
                }
                20% {
                    transform: translate(-50%, -50%) rotate(-7deg)
                        scale(1.08, 0.93);
                }
                45% {
                    transform: translate(-50%, -50%) rotate(7deg)
                        scale(0.94, 1.07);
                }
                70% {
                    transform: translate(-50%, -50%) rotate(-4deg)
                        scale(1.04, 0.96);
                }
            }
            @keyframes blink {
                0%,
                94%,
                100% {
                    transform: scaleY(0);
                }
                96% {
                    transform: scaleY(1);
                }
            }
            .bag-burst {
                position: absolute;
                width: 10px;
                height: 12px;
                border-radius: 3px;
                pointer-events: none;
                z-index: 5;
                animation: bagBurst 0.75s cubic-bezier(0.2, 0.8, 0.3, 1)
                    forwards;
            }
            @keyframes bagBurst {
                0% {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
                }
                100% {
                    opacity: 0;
                    transform: translate(
                            calc(-50% + var(--dx)),
                            calc(-50% + var(--dy))
                        )
                        scale(1.1) rotate(var(--rot));
                }
            }

            .item {
                position: absolute;
                left: 0;
                top: 0;
                width: var(--item, 72px);
                height: var(--item, 72px);
                border-radius: 50%;
                border: 3px solid var(--ink);
                background: var(--paper);
                box-shadow: 0 5px 0 var(--ink);
                display: grid;
                place-items: center;
                font-size: calc(var(--item, 72px) * 0.58);
                line-height: 1;
                transform: translate(var(--x), var(--y)) translate(-50%, -50%);
                transition:
                    transform 0.4s cubic-bezier(0.3, 1.4, 0.5, 1),
                    opacity 0.3s;
                touch-action: none;
                cursor: grab;
                padding: 0;
            }
            .item svg,
            .item img,
            .thing svg,
            .thing img,
            .reveal-thing svg,
            .reveal-thing img,
            .lib-ic svg,
            .lib-ic img {
                width: 1em;
                height: 1em;
                display: block;
                pointer-events: none;
            }
            .item.enter {
                opacity: 0;
                transform: translate(var(--x), var(--y)) translate(-50%, -50%)
                    scale(0.2);
            }
            .item.dragging {
                transition: none;
                z-index: 10;
                cursor: grabbing;
                box-shadow: 0 12px 0 var(--ink);
            }
            .item.poof {
                opacity: 0;
                transform: translate(var(--x), var(--y)) translate(-50%, -50%)
                    scale(0.1) rotate(40deg);
            }

            /* ---------- library modal ---------- */
            .lib-modal {
                position: fixed;
                inset: 0;
                z-index: 40;
                display: none;
                place-items: center;
                background: color-mix(
                    in srgb,
                    var(--sky) 82%,
                    rgba(0, 0, 0, 0.25)
                );
                padding: 14px;
                padding-top: max(14px, env(safe-area-inset-top, 0px));
                padding-bottom: max(14px, env(safe-area-inset-bottom, 0px));
            }
            .lib-modal.open {
                display: grid;
            }
            .lib-sheet {
                width: min(100%, 560px);
                height: min(86dvh, 680px);
                display: flex;
                flex-direction: column;
                background: var(--paper);
                color: var(--paper-ink);
                border: 4px solid var(--ink);
                border-radius: 28px;
                box-shadow: 0 8px 0 var(--ink);
                overflow: hidden;
                animation: cardin 0.28s cubic-bezier(0.3, 1.4, 0.5, 1);
            }
            .lib-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                padding: 12px 14px 8px;
                border-bottom: 3px solid
                    color-mix(in srgb, var(--ink) 15%, transparent);
                flex: none;
            }
            .lib-head h2 {
                margin: 0;
                font-size: 24px;
                font-weight: 800;
                line-height: 1.1;
            }
            .lib-controls {
                display: flex;
                flex-direction: column;
                gap: 8px;
                padding: 10px 14px 8px;
                flex: none;
            }
            .lib-search {
                width: 100%;
                height: 44px;
                padding: 0 14px;
                border-radius: 14px;
                border: 3px solid var(--ink);
                background: color-mix(in srgb, var(--sky) 35%, var(--paper));
                color: var(--paper-ink);
                font-weight: 700;
                font-size: 17px;
                user-select: text;
                -webkit-user-select: text;
            }
            .lib-search::placeholder {
                color: var(--soft);
                font-weight: 500;
            }
            .lib-cats {
                display: flex;
                gap: 6px;
                overflow-x: auto;
                padding-bottom: 2px;
                touch-action: pan-x;
                scrollbar-width: none;
            }
            .lib-cats::-webkit-scrollbar {
                display: none;
            }
            .lib-cat {
                flex: none;
                padding: 4px 12px;
                border-radius: 999px;
                border: 2.5px solid var(--ink);
                background: var(--paper);
                color: var(--paper-ink);
                font-weight: 700;
                font-size: 14px;
                cursor: pointer;
                box-shadow: 0 2px 0 var(--ink);
            }
            .lib-cat.active {
                background: var(--sack);
                color: #3b2a5c;
            }
            .lib-cat:active {
                transform: translateY(2px);
                box-shadow: none;
            }
            .lib-grid {
                flex: 1 1 auto;
                min-height: 0;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                touch-action: pan-y;
                padding: 6px 14px 16px;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
                align-content: start;
                gap: 10px;
            }
            .lib-card {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 4px;
                padding: 10px 6px 8px;
                border-radius: 18px;
                border: 3px solid var(--ink);
                background: color-mix(in srgb, var(--sky) 25%, var(--paper));
                color: var(--paper-ink);
                cursor: pointer;
                box-shadow: 0 4px 0 var(--ink);
                touch-action: pan-y;
            }
            .lib-card:active {
                transform: translateY(3px);
                box-shadow: 0 1px 0 var(--ink);
            }
            .lib-ic {
                font-size: 38px;
                line-height: 1;
                height: 40px;
                display: grid;
                place-items: center;
            }
            .lib-name {
                font-size: 14px;
                font-weight: 700;
                line-height: 1.15;
                text-align: center;
                word-break: break-word;
            }
            .lib-empty {
                grid-column: 1 / -1;
                text-align: center;
                padding: 28px 10px;
                font-weight: 700;
                font-size: 18px;
                color: var(--soft);
            }

            /* ---------- questions (two-tap card flip) ---------- */
            .panel {
                flex: none;
                display: none;
                flex-direction: column;
                gap: 10px;
                padding-top: 6px;
                max-height: 66%;
                min-height: 0;
            }
            body[data-phase="ask"] .panel {
                display: flex;
            }
            .questions {
                display: flex;
                flex-direction: column;
                gap: 8px;
                overflow-y: auto;
                padding: 2px 2px 8px;
                min-height: 0;
                flex: 1 1 auto;
            }
            .q {
                position: relative;
                display: flex;
                align-items: stretch;
                min-height: 54px;
                border-radius: 18px;
                border: 3px solid var(--ink);
                background: var(--paper);
                color: var(--paper-ink);
                box-shadow: 0 4px 0 var(--ink);
                transition:
                    transform 0.25s,
                    opacity 0.25s,
                    background-color 0.2s;
            }
            .q:active {
                transform: translateY(3px);
                box-shadow: 0 1px 0 var(--ink);
            }
            .q-btn {
                flex: 1;
                display: flex;
                align-items: center;
                gap: 12px;
                text-align: left;
                padding: 6px 12px 6px 6px;
                border: 0;
                background: none;
                cursor: pointer;
                font-weight: 700;
                font-size: 20px;
                line-height: 1.15;
                border-radius: 15px;
            }
            .q .ic {
                flex: none;
                width: 42px;
                height: 42px;
                border-radius: 12px;
                display: grid;
                place-items: center;
                font-size: 26px;
                background: var(--sky);
            }
            .q .q-label {
                flex: 1;
            }
            .q .repeat-btn {
                flex: none;
                width: 38px;
                height: 38px;
                margin: auto 6px auto 0;
                border-radius: 12px;
                border: 2.5px solid var(--ink);
                background: var(--paper);
                color: var(--paper-ink);
                font-size: 18px;
                display: none;
                place-items: center;
                cursor: pointer;
            }
            body[data-helper="on"] .q.asked .repeat-btn {
                display: grid;
            }
            body[data-helper="on"] .q.asked {
                background: var(--sack);
                color: #3b2a5c;
            }
            body[data-helper="on"] .q.asked .ic {
                background: rgba(255, 255, 255, 0.65);
                animation: nudge 1.4s ease-in-out infinite;
            }
            @keyframes nudge {
                0%,
                100% {
                    transform: rotate(0);
                }
                50% {
                    transform: rotate(-12deg) scale(1.12);
                }
            }
            .q .answer {
                position: absolute;
                inset: 0;
                border-radius: 15px;
                display: none;
                align-items: center;
                justify-content: center;
                gap: 10px;
                padding: 0 14px;
                font-weight: 800;
                font-size: 25px;
                color: #fff;
                cursor: pointer;
            }
            .q.revealed .answer {
                display: flex;
                animation: pop 0.25s cubic-bezier(0.3, 1.8, 0.5, 1);
            }
            .q .next-pill {
                margin-left: auto;
                font-size: 14px;
                font-weight: 800;
                padding: 4px 10px;
                border-radius: 999px;
                background: rgba(0, 0, 0, 0.22);
                color: inherit;
                text-shadow: none;
            }
            .answer.yes {
                background: var(--go);
                text-shadow: 0 2px 0 var(--go-dark);
            }
            .answer.no {
                background: var(--ribbon);
                text-shadow: 0 2px 0 #c2362c;
            }
            .answer.info {
                background: var(--paper);
                color: var(--paper-ink);
            }
            .answer.info .next-pill {
                background: color-mix(in srgb, var(--ink) 12%, transparent);
            }
            .swatch {
                width: 32px;
                height: 32px;
                border-radius: 50%;
                border: 3px solid var(--ink);
                flex: none;
            }
            .q.gone {
                opacity: 0;
                transform: translateX(60px) scale(0.9);
            }
            .q.new {
                animation: qin 0.35s cubic-bezier(0.3, 1.4, 0.5, 1);
            }
            @keyframes qin {
                from {
                    opacity: 0;
                    transform: scale(0.85);
                }
                to {
                    transform: none;
                }
            }
            .round-btn.off {
                opacity: 0.45;
            }
            .done-note {
                text-align: center;
                font-weight: 700;
                color: var(--soft);
                padding: 8px;
            }

            .stars {
                min-height: 26px;
                text-align: center;
                font-size: 20px;
                letter-spacing: 2px;
            }
            .stars span {
                display: inline-block;
                animation: pop 0.4s cubic-bezier(0.3, 1.8, 0.5, 1);
            }
            @keyframes pop {
                from {
                    transform: scale(0);
                }
                to {
                    transform: scale(1);
                }
            }

            .guessed {
                position: relative;
                overflow: hidden;
                flex: none;
                border: 3px solid var(--ink);
                border-radius: 22px;
                background: var(--go);
                color: #fff;
                font-weight: 800;
                font-size: 26px;
                padding: 12px 18px;
                box-shadow: 0 6px 0 var(--ink);
                cursor: pointer;
                touch-action: none;
                text-shadow: 0 2px 0 var(--go-dark);
            }
            .guessed::before {
                content: "";
                position: absolute;
                inset: 0;
                width: var(--hold, 0%);
                background: rgba(255, 255, 255, 0.32);
                pointer-events: none;
                border-radius: inherit;
            }
            .guessed > span {
                position: relative;
                z-index: 1;
                pointer-events: none;
            }
            .guessed.holding {
                transform: translateY(4px);
                box-shadow: 0 2px 0 var(--ink);
            }

            /* ---------- reveal ---------- */
            .reveal {
                position: fixed;
                inset: 0;
                z-index: 50;
                display: none;
                place-items: center;
                background: color-mix(in srgb, var(--sky) 80%, transparent);
                padding: 20px;
            }
            body[data-phase="reveal"] .reveal {
                display: grid;
            }
            .card {
                width: min(100%, 380px);
                text-align: center;
                background: var(--paper);
                color: var(--paper-ink);
                border: 4px solid var(--ink);
                border-radius: 32px;
                box-shadow: 0 8px 0 var(--ink);
                padding: 22px 20px 24px;
                position: relative;
                z-index: 2;
                animation: cardin 0.5s cubic-bezier(0.3, 1.5, 0.5, 1);
            }
            @keyframes cardin {
                from {
                    transform: scale(0.6) rotate(-6deg);
                    opacity: 0;
                }
                to {
                    transform: none;
                    opacity: 1;
                }
            }
            .reveal-thing {
                font-size: 120px;
                line-height: 1.1;
                display: inline-block;
                animation: bounce 1s ease-in-out infinite;
            }
            @keyframes bounce {
                0%,
                100% {
                    transform: translateY(0);
                }
                50% {
                    transform: translateY(-14px);
                }
            }
            .card h2 {
                margin: 6px 0 0;
                font-size: 32px;
                line-height: 1.1;
                font-weight: 800;
            }
            .card p {
                margin: 4px 0 18px;
                font-size: 19px;
                font-weight: 500;
                color: var(--soft);
            }
            .again {
                border: 3px solid var(--ink);
                border-radius: 22px;

            ];
            const SOME = new Set([
                "cheese",
                "bread",
                "milk",
                "popcorn",
                "broccoli",
                "corn",
                "grapes",
            ]);

            const ITEMS = LIBRARY.map((row, i) => {
                const [look, name, colors, sound, tags] = row.split("|");
                const art = SOME.has(name)
                    ? "some"
                    : /^[aeiou]/.test(name)
                      ? "an"
                      : "a";
                return {
                    id: i,
                    look,
                    name,
                    phrase: `${art} ${name}`,
                    colors: colors.split(","),
                    sound: sound === "-" ? null : sound,
                    tags: new Set(tags.split(" ")),
                };
            });

            function emojiToCodepoint(emoji) {
                return Array.from(emoji)
                    .map((c) => c.codePointAt(0).toString(16))
                    .filter((hex) => hex !== "fe0f")
                    .join("-");
            }

            /* Renders consistent Twemoji SVGs across iOS/Android/Windows, falling back to native emoji if offline without cache */

                const hex = emojiToCodepoint(item.look);

   weight: how often it should come up first.

                    ic: "🎵",
                    text: "What sound does it make?",
                    weight: 1,
                },
                {
                    key: "water",
                    ic: "💧",
                    text: "Does it go in water?",
                    weight: 1,
                },
                { key: "soft", ic: "🪶", text: "Is it soft?", weight: 1 },
                {
                    key: "kitchen",
                    ic: "🍳",
                    text: "Is it in the kitchen?",
                    weight: 1,
                },
                {
                    key: "play",
                    ic: "🎲",
                    text: "Can you play with it?",
                    weight: 1,
                },
                {
                    key: "legs",
                    ic: "🦵",
                    text: "Does it have legs?",
                    weight: 1,
                },
                {
                    key: "power",
                    ic: "🔋",
                    text: "Does it need batteries or a plug?",
                    weight: 1,
                },
                { key: "sweet", ic: "🍭", text: "Is it sweet?", weight: 1 },
                {
                    key: "outside",
                    ic: "🌳",
                    text: "Do you find it outside?",
                    weight: 1,
                },
                { key: "wear", ic: "👕", text: "Can you wear it?", weight: 1 },
                { key: "round", ic: "⚪", text: "Is it round?", weight: 1 },
                { key: "cold", ic: "❄️", text: "Is it cold?", weight: 1 },
                {
                    key: "ride",
                    ic: "🧒",
                    text: "Can you ride on it?",
                    weight: 1,
                },
                { key: "heavy", ic: "🏋️", text: "Is it heavy?", weight: 1 },
                { key: "grow", ic: "🌱", text: "Does it grow?", weight: 1 },
                {
                    key: "tail",
                    ic: "🦊",
                    text: "Does it have a tail?",
                    weight: 1,
                },
                {
                    key: "feathers",
                    ic: "🐣",
                    text: "Does it have feathers?",
                    weight: 0.8,
                },
                { key: "fruit", ic: "🍇", text: "Is it a fruit?", weight: 0.8 },
                {
                    key: "home",
                    ic: "🏠",
                    text: "Do we have one at home?",
                    weight: 0.8,
                },
            ];

            /* Orders questions for the hidden thing: big/simple ones first, a mix of
   "yes" and "no" answers, with a dash of randomness so rounds differ. */
            function questionQueue(item) {
                return QUESTIONS.map((q) => {
                    const yes =
                        q.key === "color" ||
                        (q.key === "sound"
                            ? !!item.sound
                            : item.tags.has(q.key));
                    return {
                        q,
                        score: q.weight + (yes ? 1 : 0) + Math.random() * 1.6,
                    };
                })
                    .sort((a, b) => b.score - a.score)
                    .map((x) => x.q);
            }

            const COLORS = {
                red: "#FF4B3E",
                white: "#FFFFFF",
                yellow: "#FFD23F",
                black: "#2B2B2B",
                green: "#3CC47C",
                blue: "#3E8BFF",
                orange: "#FF9533",
                brown: "#9A6233",
                grey: "#A3A8B4",
                purple: "#9B5DE5",
                pink: "#FF8CC6",
            };

            /* What the hider sees when they tap to reveal the answer. */
            function answerFor(q, item) {
                if (q.key === "color") {
                    const words = item.colors
                        .map((c) => c[0].toUpperCase() + c.slice(1))
                        .join(" and ");
                    return {
                        cls: "info",
                        html:
                            item.colors
                                .map(
                                    (c) =>
                                        `<span class="swatch" style="background:${COLORS[c] || "#ccc"}"></span>`,
                                )
                                .join("") + `<span>${words}</span>`,
                    };
                }
                if (q.key === "sound") {
                    return item.sound
                        ? { cls: "info", html: `<span>🔊 ${item.sound}</span>` }
                        : { cls: "info", html: "<span>🤫 It’s quiet</span>" };
                }
                return item.tags.has(q.key)
                    ? { cls: "yes", html: "<span>👍 Yes!</span>" }
                    : { cls: "no", html: "<span>👎 No</span>" };
            }

            /* Prunes redundant follow-up questions once a broader question is asked. */
            function pruneQueue(q, item) {
                const drop = new Set();
                if (q.key === "noise" && !item.tags.has("noise"))
                    drop.add("sound");
                if (q.key === "sound") drop.add("noise");
                if (q.key === "alive" && !item.tags.has("alive"))
                    drop.add("feathers");
                if (q.key === "eat" && !item.tags.has("eat")) {
                    drop.add("fruit");
                    drop.add("sweet");
                }
                if (q.key === "big" && item.tags.has("big")) drop.add("small");
                if (q.key === "small" && item.tags.has("small"))
                    drop.add("big");
                if (drop.size)
                    queue = queue.filter((next) => !drop.has(next.key));
            }

            /* ===================== settings & sound ===================== */
            const VISIBLE_QUESTIONS = 5;
            const ITEMS_ON_SCREEN = 8;

            let soundOn = true,
                helperOn = true;
            try {
                soundOn = localStorage.getItem("bag-sound") !== "off";
                helperOn = localStorage.getItem("bag-helper") !== "off";
            } catch (e) {}

            let audioCtx;
            function blip(kind) {
                if (!soundOn) return;
                try {
                    audioCtx =
                        audioCtx ||
                        new (
                            window.AudioContext || window.webkitAudioContext
                        )();
                    if (audioCtx.state === "suspended") audioCtx.resume();
                    const now = audioCtx.currentTime;
                    if (kind === "win") {
                        const fanfare = [
                            { f: 523.25, t: 0.0, d: 0.13, g: 0.2 },
                            { f: 659.25, t: 0.09, d: 0.13, g: 0.2 },
                            { f: 783.99, t: 0.18, d: 0.13, g: 0.22 },
                            { f: 1046.5, t: 0.28, d: 0.42, g: 0.25 },
                            { f: 659.25, t: 0.28, d: 0.42, g: 0.14 },
                        ];
                        fanfare.forEach(({ f, t, d, g }) => {
                            const o = audioCtx.createOscillator();
                            const gain = audioCtx.createGain();
                            o.type = "triangle";
                            o.frequency.setValueAtTime(f, now + t);
                            gain.gain.setValueAtTime(0.0001, now + t);
                            gain.gain.exponentialRampToValueAtTime(
                                g,
                                now + t + 0.02,
                            );
                            gain.gain.exponentialRampToValueAtTime(
                                0.0001,
                                now + t + d,
                            );
                            o.connect(gain).connect(audioCtx.destination);
                            o.start(now + t);
                            o.stop(now + t + d + 0.03);
                        });
                        return;
                    }
                    const notes =
                        kind === "gulp"
                            ? [420, 180]
                            : kind === "giggle"
                              ? [520, 660, 580, 780]
                              : kind === "bleh"
                                ? [460, 350, 240]
                                : [660];
                    notes.forEach((f, i) => {
                        const o = audioCtx.createOscillator(),
                            g = audioCtx.createGain();
                        o.type =
                            kind === "gulp" || kind === "bleh"
                                ? "sine"
                                : "triangle";
                        const t = now + i * 0.09;
                        o.frequency.setValueAtTime(f, t);
                        if (kind === "gulp")
                            o.frequency.exponentialRampToValueAtTime(
                                f * 0.6,
                                t + 0.12,
                            );
                        g.gain.setValueAtTime(0.0001, t);
                        g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
                        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
                        o.connect(g).connect(audioCtx.destination);
                        o.start(t);
                        o.stop(t + 0.25);
                    });
                } catch (e) {}
            }

            const CHEERS = [
                "Woohoo! You got it!",
                "Yay! Amazing job!",
                "Hooray! You guessed it!",
                "Awesome! You found it!",
            ];

            function audioKey(text) {
                return text
                    .toLowerCase()
                    .replace(/[^\p{L}\p{N}]+/gu, "-")
                    .replace(/^-|-$/g, "");
            }

            function speakFallback(lines, excited = false, rate = 1.0) {
                if (!("speechSynthesis" in window)) return;
                speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(lines.join(" "));
                u.rate = rate * (excited ? 1.05 : 1.0);
                u.pitch = 1.0;
                speechSynthesis.speak(u);
            }

            let activeVoiceAudio = null;
            let voiceSeq = 0;

            function stopVoice() {
                voiceSeq++;
                if (activeVoiceAudio) {
                    activeVoiceAudio.pause();
                    activeVoiceAudio.currentTime = 0;
                    activeVoiceAudio = null;
                }
                if ("speechSynthesis" in window) speechSynthesis.cancel();
            }

            function say(input, excited = false, rate = 1.0) {
                if (!soundOn) return;
                const lines = (Array.isArray(input) ? input : [input])
                    .map((t) =>
                        t
                            .replace(/[^\p{L}\p{N}\s?!.,'-]/gu, "")
                            .replace(/\s+/g, " ")
                            .trim(),
                    )
                    .filter(Boolean);
                if (!lines.length) return;

                stopVoice();
                const seq = voiceSeq;

                const playAt = (idx) => {
                    if (!soundOn || seq !== voiceSeq || idx >= lines.length)
                        return;
                    const audio = new Audio(
                        `./audio/${audioKey(lines[idx])}.mp3`,
                    );
                    audio.playbackRate = rate;
                    activeVoiceAudio = audio;
                    audio.addEventListener(
                        "ended",
                        () => {
                            setTimeout(() => playAt(idx + 1), 240);
                        },
                        { once: true },
                    );
                    audio.play().catch(() => {
                        if (seq === voiceSeq)
                            speakFallback(lines.slice(idx), excited, rate);
                    });
                };

                playAt(0);
            }

            /* ===================== elements ===================== */
            const $ = (id) => document.getElementById(id);
            const stage = $("stage"),
                bag = $("bag"),
                bagThing = $("bagThing"),
                pupils = $("pupils"),
                smileEl = $("smile");
            const questionsEl = $("questions"),
                starsEl = $("stars");
            const promptBig = $("promptBig"),
                promptSmall = $("promptSmall");
            const libraryModal = $("libraryModal"),
                libGrid = $("libGrid"),
                libSearch = $("libSearch"),
                libCats = $("libCats");
            const guessedBtn = $("guessedBtn");

            let phase = "hide";
            let shown = []; // items currently around the bag
            let hidden = null; // the item in the bag
            let queue = []; // questions waiting
            let asked = 0;
            let activeCat = "all";

            function setPhase(p) {
                phase = p;
                document.body.dataset.phase = p;
                bag.setAttribute(
                    "aria-label",
                    p === "ask"
                        ? "The bag. Press and hold to peek inside."
                        : "The bag. Tap to tickle or drag something inside.",
                );
                requestAnimationFrame(layout);
            }
            function setPrompt(big, small) {
                promptBig.textContent = big;
                promptSmall.textContent = small;
            }

            /* ===================== layout ===================== */
            function layout() {
                const w = stage.clientWidth,
                    h = stage.clientHeight;
                if (!w || !h) return;
                const m = Math.min(w, h);
                const item = Math.round(Math.max(58, Math.min(92, m * 0.2)));
                stage.style.setProperty("--item", item + "px");
                const bagW =
                    phase === "hide"
                        ? Math.min(w * 0.4, h * 0.36, 220)
                        : Math.min(w * 0.62, h * 0.78, 250);
                bag.style.setProperty("--bag-w", Math.max(90, bagW) + "px");
                document.documentElement.style.setProperty(
                    "--bag-w",
                    Math.max(90, bagW) + "px",
                );

                const rx = w / 2 - item / 2 - 4,
                    ry = h / 2 - item / 2 - 8;
                stage.querySelectorAll(".item").forEach((el) => {
                    if (el.classList.contains("dragging")) return;
                    const k = +el.dataset.slot,
                        n = ITEMS_ON_SCREEN;
                    const a = -Math.PI / 2 + (k / n) * Math.PI * 2;
                    el.style.setProperty(
                        "--x",
                        w / 2 + Math.cos(a) * rx + "px",
                    );
                    el.style.setProperty(
                        "--y",
                        h / 2 + Math.sin(a) * ry + "px",
                    );
                });
            }
            new ResizeObserver(layout).observe(stage);
            window.addEventListener("orientationchange", () => {
                setTimeout(layout, 80);
                setTimeout(layout, 300);
            });
            if (window.visualViewport) {
                window.visualViewport.addEventListener("resize", layout);
            }

            /* ===================== library picker ===================== */
            function matchesCategory(item, cat) {
                if (cat === "all") return true;
                if (cat === "animals") return item.tags.has("alive");
                if (cat === "food") return item.tags.has("eat");
                if (cat === "vehicles")
                    return item.tags.has("wheels") || item.tags.has("ride");
                if (cat === "home")
                    return (
                        item.tags.has("home") &&
                        !item.tags.has("alive") &&
                        !item.tags.has("eat")
                    );
                if (cat === "outside") return item.tags.has("outside");
                return true;
            }

            function renderLibrary() {
                const term = libSearch.value.trim().toLowerCase();
                const filtered = ITEMS.filter((it) => {
                    if (!matchesCategory(it, activeCat)) return false;
                    if (!term) return true;
                    return (
                        it.name.includes(term) ||
                        it.colors.some((c) => c.includes(term)) ||
                        it.tags.has(term)
                    );
                });

                if (!filtered.length) {
                    libGrid.innerHTML =
                        '<div class="lib-empty">Nothing matched that search</div>';
                    return;
                }

                const frag = document.createDocumentFragment();
                filtered.forEach((it) => {
                    const btn = document.createElement("button");
                    btn.className = "lib-card";
                    btn.type = "button";
                    btn.setAttribute("aria-label", `Hide ${it.phrase}`);
                    btn.innerHTML = `<span class="lib-ic" aria-hidden="true">${render(it)}</span><span class="lib-name">${it.name}</span>`;
                    btn.addEventListener("click", () => {
                        closeLibrary();
                        pickFromLibrary(it);
                    });
                    frag.appendChild(btn);
                });
                libGrid.innerHTML = "";
                libGrid.appendChild(frag);
            }

            function openLibrary() {
                if (phase !== "hide") return;
                blip("pop");
                libSearch.value = "";
                activeCat = "all";
                libCats.querySelectorAll(".lib-cat").forEach((b) => {
                    const on = b.dataset.cat === "all";
                    b.classList.toggle("active", on);
                    b.setAttribute("aria-selected", on);
                });
                renderLibrary();
                libGrid.scrollTop = 0;
                libraryModal.classList.add("open");
                $("closeLibBtn").focus({ preventScroll: true });
            }

            function closeLibrary() {
                libraryModal.classList.remove("open");
            }

            function pickFromLibrary(item) {
                if (phase !== "hide") return;
                let el = stage.querySelector(`.item[data-id="${item.id}"]`);
                if (!el) {
                    el = document.createElement("button");
                    el.className = "item";
                    el.dataset.id = item.id;
                    el.innerHTML = render(item);
                    el.style.setProperty("--x", stage.clientWidth / 2 + "px");
                    el.style.setProperty(
                        "--y",
                        stage.clientHeight * 0.16 + "px",
                    );
                    stage.appendChild(el);
                    el.getBoundingClientRect();
                }
                hide(item, el);
            }

            $("libraryBtn").addEventListener("click", openLibrary);
            $("closeLibBtn").addEventListener("click", closeLibrary);
            libraryModal.addEventListener("click", (e) => {
                if (e.target === libraryModal) closeLibrary();
            });
            libSearch.addEventListener("input", renderLibrary);
            libCats.addEventListener("click", (e) => {
                const btn = e.target.closest(".lib-cat");
                if (!btn) return;
                activeCat = btn.dataset.cat;
                libCats.querySelectorAll(".lib-cat").forEach((b) => {
                    const on = b === btn;
                    b.classList.toggle("active", on);
                    b.setAttribute("aria-selected", on);
                });
                libGrid.scrollTop = 0;
                renderLibrary();
            });
            document.addEventListener("keydown", (e) => {
                if (
                    e.key === "Escape" &&
                    libraryModal.classList.contains("open")
                )
                    closeLibrary();
            });

            /* ===================== round flow ===================== */
            function shuffle(arr) {
                const a = arr.slice();
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            function dealItems() {
                stage.querySelectorAll(".item").forEach((el) => el.remove());
                shown = shuffle(ITEMS).slice(0, ITEMS_ON_SCREEN);
                shown.forEach((it, k) => {
                    const el = document.createElement("button");
                    el.className = "item enter";
                    el.dataset.slot = k;
                    el.dataset.id = it.id;
                    el.innerHTML = render(it);
                    el.setAttribute(
                        "aria-label",
                        `Put ${it.phrase} in the bag`,
                    );
                    stage.appendChild(el);
                    bindDrag(el, it);
                });
                layout();
                stage
                    .querySelectorAll(".item")
                    .forEach((el, k) =>
                        setTimeout(
                            () => el.classList.remove("enter"),
                            40 + k * 45,
                        ),
                    );
            }

            function newRound() {
                stopVoice();
                cancelGuessHold();
                closeLibrary();
                tickleTimes = [];
                setPhase("hide");
                resetBagFace();
                hidden = null;
                asked = 0;
                queue = [];
                bagThing.innerHTML = "";
                questionsEl.innerHTML = "";
                starsEl.innerHTML = "";
                bag.classList.remove("peeking");
                bag.classList.add("open", "hungry");
                $("libraryBtn").hidden = false;
                $("confetti").innerHTML = "";
                setPrompt(
                    "🙈 Guesser, close your eyes!",
                    "Drag something into the bag",
                );
                dealItems();
            }

            function hide(item, el) {
                if (phase !== "hide") return;
                resetBagFace();
                closeLibrary();
                hidden = item;
                bagThing.innerHTML = render(item);

                // the chosen thing dives into the mouth of the bag
                const sr = stage.getBoundingClientRect(),
                    br = bag.getBoundingClientRect();
                el.style.setProperty(
                    "--x",
                    br.left + br.width / 2 - sr.left + "px",
                );
                el.style.setProperty(
                    "--y",
                    br.top + br.height * 0.35 - sr.top + "px",
                );
                el.classList.remove("dragging");
                el.style.transform = "";
                el.classList.add("poof");

                // everything else disappears
                stage.querySelectorAll(".item").forEach((o, k) => {
                    if (o !== el)
                        setTimeout(() => o.classList.add("poof"), 60 + k * 35);
                    o.disabled = true;
                });
                setTimeout(
                    () =>
                        stage
                            .querySelectorAll(".item")
                            .forEach((o) => o.remove()),
                    700,
                );

                bag.classList.remove("hungry");
                bag.classList.add("gulp");
                blip("gulp");
                setTimeout(() => {
                    bag.classList.remove("open", "gulp");
                }, 380);

                setTimeout(() => {
                    setPhase("ask");
                    $("libraryBtn").hidden = true;
                    setPrompt(
                        "What’s in the bag? 🤔",
                        helperOn
                            ? "Tap a question, then tap again to peek answer"
                            : "Tap a question to ask it",
                    );
                    queue = questionQueue(item);
                    for (let i = 0; i < VISIBLE_QUESTIONS; i++) addQuestion();
                    layout();
                    say(
                        [
                            "It's in the bag!",
                            "Open your eyes.",
                            "What's in the bag?",
                        ],
                        false,
                        1.3,
                    );
                }, 520);
            }

            function addQuestion(beforeEl) {
                const q = queue.shift();
                if (!q) {
                    if (
                        !questionsEl.querySelector(".q") &&
                        !questionsEl.querySelector(".done-note")
                    ) {
                        questionsEl.innerHTML =
                            '<div class="done-note">No more questions. Make a guess!</div>';
                    }
                    return;
                }
                const card = document.createElement("div");
                card.className = "q new";
                const a = answerFor(q, hidden);
                card.innerHTML = `
    <button class="q-btn" type="button"><span class="ic" aria-hidden="true">${q.ic}</span><span class="q-label">${q.text}</span></button>
    <button class="repeat-btn" type="button" aria-label="Repeat question">🔊</button>
    <div class="answer ${a.cls}" role="button" tabindex="0" aria-live="polite" aria-label="Answer shown. Tap for next question.">${a.html}<span class="next-pill">Next ➔</span></div>`;

                const btn = card.querySelector(".q-btn"),
                    icEl = card.querySelector(".ic"),
                    labelEl = card.querySelector(".q-label"),
                    repeatBtn = card.querySelector(".repeat-btn"),
                    ansOverlay = card.querySelector(".answer");

                const replace = () => {
                    if (card.classList.contains("gone")) return;
                    card.classList.add("gone");
                    setTimeout(() => {
                        addQuestion(card);
                        card.remove();
                    }, 360);
                };
                card._replace = replace;

                repeatBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    say(q.text);
                });

                btn.addEventListener("click", () => {
                    // Step 1: Unasked -> Ask question aloud & flip card to Hider Peek prompt
                    if (!card.classList.contains("asked")) {
                        say(q.text);
                        blip("pop");
                        asked++;
                        pruneQueue(q, hidden);
                        const s = document.createElement("span");
                        s.textContent = "⭐";
                        starsEl.appendChild(s);
                        card.classList.add("asked");
                        if (helperOn) {
                            icEl.textContent = "🤫";
                            labelEl.textContent = "Tap to peek answer";
                        } else {
                            setTimeout(replace, 450);
                        }
                        return;
                    }
                    // Step 2: Asked -> Reveal full-card answer for Hider
                    if (helperOn && !card.classList.contains("revealed")) {
                        blip("pop");
                        card.classList.add("revealed");
                    }
                });

                // Step 3: Revealed -> Tap anywhere on the answer banner to dismiss & load next question
                ansOverlay.addEventListener("click", () => {
                    blip("pop");
                    replace();
                });
                ansOverlay.addEventListener("keydown", (e) => {
                    if (e.key === " " || e.key === "Enter") {
                        e.preventDefault();
                        replace();
                    }
                });

                questionsEl.insertBefore(card, beforeEl || null);
            }

            function reveal() {
                if (phase !== "ask") return;
                cancelGuessHold();
                setPhase("reveal");
                bag.classList.add("open", "peeking");
                $("revealThing").innerHTML = render(hidden);
                $("revealTitle").textContent = `It's ${hidden.phrase}!`;
                $("revealNote").textContent =
                    asked === 0
                        ? "Wow, no questions at all!"
                        : `You asked ${asked} question${asked === 1 ? "" : "s"} ⭐`;
                const cheer =
                    CHEERS[Math.floor(Math.random() * CHEERS.length)];
                blip("win");
                setTimeout(() => {
                    if (phase === "reveal") {
                        say([cheer, `It's ${hidden.phrase}!`], true);
                    }
                }, 420);
                const c = $("confetti");
                const colors = [
                    "#FF5A4E",
                    "#F2B33D",
                    "#3CC47C",
                    "#4FA8FF",
                    "#B57BFF",
                    "#FF8CC6",
                ];
                for (let i = 0; i < 60; i++) {
                    const p = document.createElement("i");
                    p.style.left = Math.random() * 100 + "vw";
                    p.style.background = colors[i % colors.length];
                    p.style.animationDuration = 1.8 + Math.random() * 1.8 + "s";
                    p.style.animationDelay = Math.random() * 0.6 + "s";
                    c.appendChild(p);
                }
                $("againBtn").focus({ preventScroll: true });
            }

            /* ===================== hold-to-guess ===================== */
            const GUESS_HOLD_MS = 1000;
            let guessRaf = 0;
            let guessStart = 0;

            function cancelGuessHold() {
                if (guessRaf) {
                    cancelAnimationFrame(guessRaf);
                    guessRaf = 0;
                }
                guessedBtn.classList.remove("holding");
                guessedBtn.style.setProperty("--hold", "0%");
            }

            function startGuessHold() {
                if (phase !== "ask" || guessRaf) return;
                guessStart = performance.now();
                guessedBtn.classList.add("holding");
                const tick = (now) => {
                    const pct = Math.min(
                        100,
                        ((now - guessStart) / GUESS_HOLD_MS) * 100,
                    );
                    guessedBtn.style.setProperty("--hold", pct + "%");
                    if (pct >= 100) {
                        guessRaf = 0;
                        reveal();
                    } else {
                        guessRaf = requestAnimationFrame(tick);
                    }
                };
                guessRaf = requestAnimationFrame(tick);
            }

            guessedBtn.addEventListener("pointerdown", (e) => {
                if (e.button && e.button !== 0) return;
                e.preventDefault();
                try {
                    guessedBtn.setPointerCapture(e.pointerId);
                } catch (_) {}
                startGuessHold();
            });
            ["pointerup", "pointercancel", "lostpointercapture"].forEach((ev) =>
                guessedBtn.addEventListener(ev, cancelGuessHold),
            );
            guessedBtn.addEventListener("keydown", (e) => {
                if ((e.key === " " || e.key === "Enter") && !e.repeat) {
                    e.preventDefault();
                    startGuessHold();
                }
            });
            guessedBtn.addEventListener("keyup", (e) => {
                if (e.key === " " || e.key === "Enter") cancelGuessHold();
            });
            guessedBtn.addEventListener("contextmenu", (e) =>
                e.preventDefault(),
            );

            /* ===================== drag & tap ===================== */
            function lookAt(clientX, clientY) {
                const r = bag.getBoundingClientRect();
                const cx = r.left + r.width * 0.5,
                    cy = r.top + r.height * 0.64;
                const dx = clientX - cx,
                    dy = clientY - cy,
                    d = Math.hypot(dx, dy) || 1;
                pupils.style.transform = `translate(${(dx / d) * 5}px, ${(dy / d) * 5}px)`;
            }

            function overBag(x, y) {
                const r = bag.getBoundingClientRect();
                const cx = r.left + r.width / 2,
                    cy = r.top + r.height / 2;
                return Math.hypot(x - cx, y - cy) < r.width * 0.65;
            }

            function bindDrag(el, item) {
                let sx,
                    sy,
                    ox,
                    oy,
                    t0,
                    moved = false,
                    active = false;
                el.addEventListener("pointerdown", (e) => {
                    if (phase !== "hide") return;
                    e.preventDefault();
                    active = true;
                    moved = false;
                    t0 = Date.now();
                    sx = e.clientX;
                    sy = e.clientY;
                    ox = parseFloat(el.style.getPropertyValue("--x"));
                    oy = parseFloat(el.style.getPropertyValue("--y"));
                    el.setPointerCapture(e.pointerId);
                });
                el.addEventListener("pointermove", (e) => {
                    if (!active) return;
                    const dx = e.clientX - sx,
                        dy = e.clientY - sy;
                    if (!moved && Math.hypot(dx, dy) > 8) {
                        moved = true;
                        el.classList.add("dragging");
                    }
                    if (!moved) return;
                    el.style.transform = `translate(${ox + dx}px, ${oy + dy}px) translate(-50%, -50%) scale(1.15)`;
                    lookAt(e.clientX, e.clientY);
                    bag.classList.toggle(
                        "hungry",
                        !overBag(e.clientX, e.clientY),
                    );
                });
                const end = (e) => {
                    if (!active) return;
                    active = false;
                    pupils.style.transform = "";
                    if (!moved) {
                        // a simple tap also works for little fingers
                        if (Date.now() - t0 < 600) hide(item, el);
                        return;
                    }
                    if (overBag(e.clientX, e.clientY)) {
                        hide(item, el);
                        return;
                    }
                    el.classList.remove("dragging");
                    el.style.transform = "";
                    bag.classList.add("hungry");
                };
                el.addEventListener("pointerup", end);
                el.addEventListener("pointercancel", end);
            }

            /* ===================== empty bag tickle easter egg ===================== */
            const GIGGLES = [
                "Tee-hee! That tickles!",
                "Hehe, my tummy is empty!",
                "Stop it, I'm ticklish!",
                "Feed me something yummy!",
            ];
            let tickleTimes = [];
            let tickleTimer = 0;

            function resetBagFace() {
                clearTimeout(tickleTimer);
                tickleTimer = 0;
                bag.classList.remove("tickle");
                smileEl.setAttribute("d", "M86,166 Q100,182 114,166");
                smileEl.setAttribute("fill", "none");
                if (phase === "hide") bag.classList.add("hungry");
            }

            function spawnMouthBurst() {
                const colors = [
                    "#FF5A4E",
                    "#F2B33D",
                    "#3CC47C",
                    "#4FA8FF",
                    "#B57BFF",
                    "#FF8CC6",
                ];
                const cx = stage.clientWidth / 2;
                const cy = stage.clientHeight * 0.42;
                for (let i = 0; i < 14; i++) {
                    const dot = document.createElement("i");
                    const angle =
                        -Math.PI * 0.85 + (i / 13) * (Math.PI * 0.7);
                    const dist = 65 + Math.random() * 55;
                    dot.className = "bag-burst";
                    dot.style.left = cx + "px";
                    dot.style.top = cy + "px";
                    dot.style.background = colors[i % colors.length];
                    dot.style.setProperty(
                        "--dx",
                        Math.round(Math.cos(angle) * dist) + "px",
                    );
                    dot.style.setProperty(
                        "--dy",
                        Math.round(Math.sin(angle) * dist - 15) + "px",
                    );
                    dot.style.setProperty(
                        "--rot",
                        Math.round((Math.random() - 0.5) * 540) + "deg",
                    );
                    stage.appendChild(dot);
                    setTimeout(() => dot.remove(), 780);
                }
            }

            function tickleBag() {
                if (phase !== "hide") return;
                const now = Date.now();
                tickleTimes = tickleTimes.filter((t) => now - t < 2000);
                tickleTimes.push(now);

                clearTimeout(tickleTimer);
                bag.classList.remove("hungry", "tickle");
                void bag.offsetWidth; // restart wiggle if tapped rapidly
                bag.classList.add("tickle");
                smileEl.setAttribute("d", "M82,162 Q100,194 118,162 Z");
                smileEl.setAttribute("fill", "var(--mouth)");

                if (tickleTimes.length >= 3) {
                    tickleTimes = [];
                    blip("bleh");
                    say("Bleh! Nothing in here!");
                    spawnMouthBurst();
                } else {
                    const line =
                        GIGGLES[Math.floor(Math.random() * GIGGLES.length)];
                    blip("giggle");
                    say(line);
                }

                tickleTimer = setTimeout(resetBagFace, 680);
            }

            /* ===================== peek (press & hold the bag) ===================== */
            function peek(on) {
                if (phase !== "ask") return;
                bag.classList.toggle("open", on);
                bag.classList.toggle("peeking", on);
                pupils.style.transform = on ? "translate(0, -5px)" : "";
            }
            bag.addEventListener("pointerdown", (e) => {
                if (e.button && e.button !== 0) return;
                e.preventDefault();
                if (phase === "hide") {
                    tickleBag();
                    return;
                }
                peek(true);
                try {
                    bag.setPointerCapture(e.pointerId);
                } catch (_) {}
            });
            ["pointerup", "pointercancel", "lostpointercapture"].forEach((ev) =>
                bag.addEventListener(ev, () => peek(false)),
            );
            bag.addEventListener("contextmenu", (e) => e.preventDefault());
            bag.addEventListener("keydown", (e) => {
                if ((e.key === " " || e.key === "Enter") && !e.repeat) {
                    if (phase === "hide") tickleBag();
                    else peek(true);
                }
            });
            bag.addEventListener("keyup", (e) => {
                if (e.key === " " || e.key === "Enter") peek(false);
            });

            /* ===================== buttons ===================== */
            $("logoBtn").addEventListener("click", () => {
                blip("pop");
                newRound();
            });
            $("againBtn").addEventListener("click", newRound);
            $("restartBtn").addEventListener("click", newRound);
            function paintSound() {
                $("soundBtn").textContent = soundOn ? "🔊" : "🔇";
                $("soundBtn").setAttribute(
                    "aria-label",
                    soundOn ? "Sound on" : "Sound off",
                );
            }
            $("soundBtn").addEventListener("click", () => {
                soundOn = !soundOn;
                try {
                    localStorage.setItem("bag-sound", soundOn ? "on" : "off");
                } catch (e) {}
                if (!soundOn) stopVoice();
                paintSound();
                blip("pop");
            });
            paintSound();
            function paintHelper() {
                document.body.dataset.helper = helperOn ? "on" : "off";
                $("helperBtn").classList.toggle("off", !helperOn);
                $("helperBtn").setAttribute(
                    "aria-label",
                    helperOn ? "Answer helper on" : "Answer helper off",
                );
                $("helperBtn").setAttribute("aria-pressed", helperOn);
            }
            $("helperBtn").addEventListener("click", () => {
                helperOn = !helperOn;
                try {
                    localStorage.setItem("bag-helper", helperOn ? "on" : "off");
                } catch (e) {}
                paintHelper();
                blip("pop");
                if (phase === "ask") {
                    setPrompt(
                        "What’s in the bag? 🤔",
                        helperOn
                            ? "Tap a question, then tap again to peek answer"
                            : "Tap a question to ask it",
                    );
                    // with the helper off, asked questions move on straight away without showing answers
                    if (!helperOn) {
                        questionsEl
                            .querySelectorAll(".q.asked")
                            .forEach((card) => {
                                if (card._replace) card._replace();
                            });
                    }
                }
            });
            paintHelper();

            // no pinch-zoom or long-press menus for little hands
            document.addEventListener("gesturestart", (e) =>
                e.preventDefault(),
            );
            document.addEventListener("contextmenu", (e) => e.preventDefault());
            document.addEventListener("dblclick", (e) => e.preventDefault());

            newRound();

            if (
                "serviceWorker" in navigator &&
                location.protocol.startsWith("http")
            ) {
                window.addEventListener("load", () =>
                    navigator.serviceWorker.register("./sw.js").catch(() => {}),
                );
            }
        </script>
    </body>
</html>
