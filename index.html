<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
        />
        <title>Bag</title>
        <meta
            name="description"
            content="A guessing game for little ones: hide something in the bag, then ask questions to find out what it is."
        />
        <link rel="manifest" href="manifest.webmanifest" />
        <meta name="color-scheme" content="light dark" />
        <meta
            name="theme-color"
            content="#BDE7FF"
            media="(prefers-color-scheme: light)"
        />
        <meta
            name="theme-color"
            content="#1C2554"
            media="(prefers-color-scheme: dark)"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Bag" />
        <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
        <link
            rel="icon"
            type="image/png"
            sizes="192x192"
            href="icons/icon-192.png"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="./styles.css" />
    </head>
    <body data-phase="hide">
        <div class="app">
            <header class="bar">
                <button
                    class="logo"
                    id="logoBtn"
                    type="button"
                    aria-label="Back to main screen"
                >
                    <svg viewBox="0 40 200 180" aria-hidden="true">
                        <use href="#sackShape" />
                    </svg>
                    Bag
                </button>
                <button
                    class="round-btn"
                    id="libraryBtn"
                    type="button"
                    aria-label="Pick from all 100 things"
                >
                    📚
                </button>
                <button
                    class="round-btn"
                    id="helperBtn"
                    type="button"
                    aria-label="Answer helper on"
                >
                    🤫
                </button>
                <button
                    class="round-btn"
                    id="themeBtn"
                    type="button"
                    aria-label="Switch theme"
                >
                    🌙
                </button>
                <button
                    class="round-btn"
                    id="soundBtn"
                    type="button"
                    aria-label="Sound on"
                >
                    🔊
                </button>
                <button
                    class="round-btn"
                    id="restartBtn"
                    type="button"
                    aria-label="Start again"
                >
                    ↺
                </button>
            </header>

            <div class="prompt" aria-live="polite">
                <div class="big" id="promptBig">
                    🙈 Guesser, close your eyes!
                </div>
                <div class="small" id="promptSmall">
                    Drag something into the bag
                </div>
            </div>

            <div class="play-area">
                <main class="stage" id="stage">
                    <button
                        class="bag open hungry"
                        id="bag"
                        type="button"
                        aria-label="The bag. Tap to boop or drag something inside."
                    >
                        <!-- back layer: the inside of the mouth -->
                        <svg viewBox="0 0 200 220" aria-hidden="true">
                            <g class="open-only">
                                <ellipse
                                    cx="100"
                                    cy="78"
                                    rx="62"
                                    ry="18"
                                    fill="var(--mouth)"
                                />
                                <path
                                    d="M38,78 A62,18 0 0 1 162,78"
                                    fill="none"
                                    stroke="var(--sack-dark)"
                                    stroke-width="7"
                                    stroke-linecap="round"
                                />
                            </g>
                        </svg>
                        <div class="inside">
                            <div class="thing" id="bagThing"></div>
                        </div>
                        <!-- front layer: body, face, tie -->
                        <svg viewBox="0 0 200 220" aria-hidden="true">
                            <defs>
                                <g id="sackShape">
                                    <path
                                        d="M64,90 C36,100 12,150 22,182 C32,212 70,216 100,216 C130,216 168,212 178,182 C188,150 164,100 136,90 Z"
                                        fill="var(--sack)"
                                        stroke="var(--ink)"
                                        stroke-width="5"
                                        stroke-linejoin="round"
                                    />
                                    <path
                                        d="M60,92 C50,72 42,50 58,36 C68,46 80,30 90,40 C96,28 104,28 110,40 C120,30 132,46 142,36 C158,50 150,72 140,92 Z"
                                        fill="var(--sack)"
                                        stroke="var(--ink)"
                                        stroke-width="5"
                                        stroke-linejoin="round"
                                    />
                                    <rect
                                        x="54"
                                        y="80"
                                        width="92"
                                        height="15"
                                        rx="7.5"
                                        fill="var(--ribbon)"
                                        stroke="var(--ink)"
                                        stroke-width="4"
                                    />
                                </g>
                            </defs>
                            <path
                                class="open-only"
                                d="M38,78 C30,105 12,150 22,182 C32,212 70,216 100,216 C130,216 168,212 178,182 C188,150 170,105 162,78 A62,18 0 0 1 38,78 Z"
                                fill="var(--sack)"
                                stroke="var(--ink)"
                                stroke-width="5"
                                stroke-linejoin="round"
                            />
                            <path
                                class="closed-only"
                                d="M64,90 C36,100 12,150 22,182 C32,212 70,216 100,216 C130,216 168,212 178,182 C188,150 164,100 136,90 Z"
                                fill="var(--sack)"
                                stroke="var(--ink)"
                                stroke-width="5"
                                stroke-linejoin="round"
                            />
                            <path
                                d="M40,188 C70,204 130,204 160,188"
                                fill="none"
                                stroke="var(--sack-dark)"
                                stroke-width="3"
                                stroke-dasharray="7 7"
                                stroke-linecap="round"
                            />
                            <g class="open-only">
                                <path
                                    d="M38,78 A62,18 0 0 0 162,78"
                                    fill="none"
                                    stroke="var(--ink)"
                                    stroke-width="5"
                                    stroke-linecap="round"
                                />
                            </g>
                            <g class="closed-only">
                                <path
                                    d="M60,92 C50,72 42,50 58,36 C68,46 80,30 90,40 C96,28 104,28 110,40 C120,30 132,46 142,36 C158,50 150,72 140,92 Z"
                                    fill="var(--sack)"
                                    stroke="var(--ink)"
                                    stroke-width="5"
                                    stroke-linejoin="round"
                                />
                                <rect
                                    x="54"
                                    y="80"
                                    width="92"
                                    height="15"
                                    rx="7.5"
                                    fill="var(--ribbon)"
                                    stroke="var(--ink)"
                                    stroke-width="4"
                                />
                                <ellipse
                                    cx="84"
                                    cy="87"
                                    rx="15"
                                    ry="10"
                                    fill="var(--ribbon)"
                                    stroke="var(--ink)"
                                    stroke-width="4"
                                />
                                <ellipse
                                    cx="116"
                                    cy="87"
                                    rx="15"
                                    ry="10"
                                    fill="var(--ribbon)"
                                    stroke="var(--ink)"
                                    stroke-width="4"
                                />
                                <circle
                                    cx="100"
                                    cy="87"
                                    r="7"
                                    fill="var(--ribbon)"
                                    stroke="var(--ink)"
                                    stroke-width="4"
                                />
                            </g>
                            <!-- face -->
                            <g>
                                <circle
                                    cx="76"
                                    cy="140"
                                    r="15"
                                    fill="#fff"
                                    stroke="var(--ink)"
                                    stroke-width="4"
                                />
                                <circle
                                    cx="124"
                                    cy="140"
                                    r="15"
                                    fill="#fff"
                                    stroke="var(--ink)"
                                    stroke-width="4"
                                />
                                <g class="pupils" id="pupils">
                                    <circle
                                        cx="76"
                                        cy="140"
                                        r="7"
                                        fill="#3B2A5C"
                                    />
                                    <circle
                                        cx="124"
                                        cy="140"
                                        r="7"
                                        fill="#3B2A5C"
                                    />
                                    <circle
                                        cx="79"
                                        cy="137"
                                        r="2.4"
                                        fill="#fff"
                                    />
                                    <circle
                                        cx="127"
                                        cy="137"
                                        r="2.4"
                                        fill="#fff"
                                    />
                                </g>
                                <g class="lids">
                                    <circle
                                        cx="76"
                                        cy="140"
                                        r="15.5"
                                        fill="var(--sack)"
                                        stroke="var(--ink)"
                                        stroke-width="4"
                                    />
                                    <circle
                                        cx="124"
                                        cy="140"
                                        r="15.5"
                                        fill="var(--sack)"
                                        stroke="var(--ink)"
                                        stroke-width="4"
                                    />
                                </g>
                                <ellipse
                                    cx="58"
                                    cy="166"
                                    rx="9"
                                    ry="5.5"
                                    fill="#FF8C7A"
                                    opacity=".75"
                                />
                                <ellipse
                                    cx="142"
                                    cy="166"
                                    rx="9"
                                    ry="5.5"
                                    fill="#FF8C7A"
                                    opacity=".75"
                                />
                                <path
                                    id="smile"
                                    d="M86,166 Q100,182 114,166"
                                    fill="none"
                                    stroke="var(--ink)"
                                    stroke-width="5"
                                    stroke-linecap="round"
                                />
                            </g>
                        </svg>
                    </button>
                </main>

                <section class="panel" aria-label="Questions">
                    <div class="stars" id="stars" aria-live="polite"></div>
                    <div class="questions" id="questions"></div>
                    <button
                        class="guessed"
                        id="guessedBtn"
                        type="button"
                        aria-label="Hold for 1 second to guess"
                    >
                        <span>Hold to guess! 🎉</span>
                    </button>
                </section>
            </div>
        </div>

        <div
            class="lib-modal"
            id="libraryModal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="libTitle"
        >
            <div class="lib-sheet">
                <div class="lib-head">
                    <h2 id="libTitle">All 100 things</h2>
                    <button
                        class="round-btn"
                        id="closeLibBtn"
                        type="button"
                        aria-label="Close library"
                    >
                        ✕
                    </button>
                </div>
                <div class="lib-controls">
                    <input
                        class="lib-search"
                        id="libSearch"
                        type="search"
                        placeholder="Search (e.g. dog, car, fruit)..."
                        autocomplete="off"
                        spellcheck="false"
                    />
                    <div
                        class="lib-cats"
                        id="libCats"
                        role="tablist"
                        aria-label="Categories"
                    >
                        <button
                            class="lib-cat active"
                            data-cat="all"
                            type="button"
                            role="tab"
                            aria-selected="true"
                        >
                            All (100)
                        </button>
                        <button
                            class="lib-cat"
                            data-cat="animals"
                            type="button"
                            role="tab"
                            aria-selected="false"
                        >
                            🐾 Animals
                        </button>
                        <button
                            class="lib-cat"
                            data-cat="food"
                            type="button"
                            role="tab"
                            aria-selected="false"
                        >
                            🍎 Food
                        </button>
                        <button
                            class="lib-cat"
                            data-cat="vehicles"
                            type="button"
                            role="tab"
                            aria-selected="false"
                        >
                            🚗 Vehicles
                        </button>
                        <button
                            class="lib-cat"
                            data-cat="home"
                            type="button"
                            role="tab"
                            aria-selected="false"
                        >
                            🏠 Home & Toys
                        </button>
                        <button
                            class="lib-cat"
                            data-cat="outside"
                            type="button"
                            role="tab"
                            aria-selected="false"
                        >
                            🌳 Outside
                        </button>
                    </div>
                </div>
                <div class="lib-grid" id="libGrid"></div>
            </div>
        </div>

        <div
            class="reveal"
            id="reveal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="revealTitle"
        >
            <div class="confetti" id="confetti"></div>
            <div class="card">
                <div class="reveal-thing" id="revealThing"></div>
                <h2 id="revealTitle"></h2>
                <p id="revealNote"></p>
                <button class="again" id="againBtn" type="button">
                    Play again 🔁
                </button>
            </div>
        </div>

        <script type="module" src="./app.js"></script>
    </body>
</html>
